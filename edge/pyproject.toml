[project]
name = "hawk-edge"
version = "0.1.0"
description = "Hawk-AI Edge Emulation - Traffic violation detection on edge hardware"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "opencv-python-headless>=4.9,<5.0",
    "numpy>=1.26,<3.0",
]

[dependency-groups]
gps = [
    "pyserial>=3.5",
    "pynmea2>=1.19",
]
crypto = [
    "cryptography>=42.0",
]
ml = [
    "ultralytics>=8.2",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawk_edge"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: mark test as slow to run"
]

[tool.mypy]
python_version = "3.11"
strict = true
